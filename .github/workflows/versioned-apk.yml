name: Build Versioned APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-versioned-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build release APK
        run: ./gradlew --no-daemon clean assembleRelease

      - name: Prepare versioned APK artifact
        id: apk
        run: |
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)"

          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ] || [ -z "$APK_PATH" ]; then
            echo "Failed to resolve version metadata or APK path."
            exit 1
          fi

          APK_NAME="PointsTracker-v${VERSION_NAME}-${VERSION_CODE}-release-unsigned.apk"
          cp "$APK_PATH" "$APK_NAME"

          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload versioned APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_name }}
          if-no-files-found: error
